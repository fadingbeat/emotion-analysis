<section *ngIf="tColorList && tColorList.length > 0" class="w-full -mt-8 sm:mt-0 lg:mt-0">

  <!-- Section Title -->
  <div class="max-w-6xl mx-auto mb-8">
    <h2 class="text-2xl sm:text-3xl font-bold text-gray-900">
      Your Emotions
    </h2>
  </div>

  <!-- Grid Container: 1 col mobile, 2 col tablet, 3 col desktop -->
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6 max-w-6xl mx-auto">

    <mat-card *ngFor="let emotion of tColorList; let i = index" [ngStyle]="{'background-color': emotion.selectedHex}"
      class="shadow-lg hover:shadow-xl transition-shadow duration-300 overflow-hidden">

      <mat-card-header class="px-4 sm:px-6 py-3 sm:py-4">
        <mat-card-title [ngClass]="isLightColor(emotion.selectedHex) ? 'text-gray-900' : 'text-white'"
          class="text-lg sm:text-2xl font-bold">
          {{ emotion.emotionName }}
        </mat-card-title>
      </mat-card-header>

      <mat-card-content [ngClass]="isLightColor(emotion.selectedHex) ? 'text-gray-900' : 'text-white'"
        class="px-4 sm:px-6 py-4 space-y-4">
        <mat-form-field class="w-full">
          <mat-label class="text-grey">Choose
            color</mat-label>
          <mat-select [(value)]="emotion.selectedValue" (selectionChange)="onColorChange($event.value, i)">
            <mat-option *ngFor="let color of emotion.colorOptions" [value]="color">
              {{ color }}
            </mat-option>
          </mat-select>
        </mat-form-field>

        <p [ngClass]="isLightColor(emotion.selectedHex) ? 'text-gray-700' : 'text-white/90'" class="text-xs sm:text-sm">
          {{ getColorDescription(emotion.selectedHex) }}
        </p>
      </mat-card-content>

      <mat-card-actions [ngClass]="isLightColor(emotion.selectedHex) ? '' : ''" class="px-4 sm:px-6 py-3">
        <button mat-stroked-button
          [ngClass]="isLightColor(emotion.selectedHex) ? 'text-gray-900 border-gray-900 hover:bg-gray-900/10' : 'text-white border-white hover:bg-white/20'"
          (click)="openVisualizationModal(emotion.emotionType, emotion.selectedHex)"
          class="w-full text-sm border-white hover:bg-white/20">
          Visualize
        </button>
      </mat-card-actions>

    </mat-card>

  </div>

</section>
<app-emotion-visualization-modal *ngIf="showVisualizationModal" [emotion]="selectedEmotionForModal"
  [color]="selectedColorForModal" (close)="closeVisualizationModal()">
</app-emotion-visualization-modal>
