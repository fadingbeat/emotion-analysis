<!-- Full-screen modal overlay -->
<div class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50" (click)="close.emit()"
    [@fadeIn]>

    <!-- Modal container -->
    <div class="relative w-11/12 sm:w-96 h-96 rounded-2xl shadow-2xl overflow-hidden" [style.background-color]="color"
        (click)="$event.stopPropagation()" [@slideUp]>

        <!-- Close button (top right) -->
        <button (click)="close.emit()" class="absolute top-4 right-4 text-white hover:bg-white/20 rounded-full p-2 z-10
             transition-all duration-200">
            <span class="text-2xl">✕</span>
        </button>

        <!-- SVG Shape - Animated -->
        <div class="absolute inset-0 flex items-center justify-center opacity-20">
            <svg [attr.width]="200" [attr.height]="200" [style.color]="color"
                [ngClass]="'animate-' + shapeConfig.animation">
                <g [innerHTML]="safeSvg"></g>
            </svg>
        </div>

        <!-- Content - centered text -->
        <div class="relative h-full flex flex-col items-center justify-center text-center px-6 py-8 space-y-6">

            <!-- Main visualization text -->
            <h2 class="text-2xl sm:text-3xl font-bold text-white leading-tight">
                {{ visualization.text }}
            </h2>

            <!-- Affirmation -->
            <p class="text-lg sm:text-xl text-white/90 italic font-light">
                "{{ visualization.affirmation }}"
            </p>

            <!-- Timer indicator (optional - shows time remaining) -->
            <div class="text-white/70 text-sm">
                Close in 60s or click to exit
            </div>

        </div>

    </div>

</div>
