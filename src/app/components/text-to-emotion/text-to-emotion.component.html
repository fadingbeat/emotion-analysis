<form class="w-full  bg-gray-50">

  <!-- Hero Section -->
  <section class="w-full px-4 sm:px-6 lg:px-8 py-8 sm:py-12 lg:py-16">
    <div class="max-w-4xl mx-auto">
      <h1 class="text-3xl sm:text-4xl lg:text-5xl font-bold text-gray-900 text-center leading-tight tracking-tight">
        Tell me what's on your <span class="text-sky-500 underline decoration-sky-500 decoration-2">mind</span>,
        <br class="hidden sm:block" />
        and I'll tell you what's in your <span
          class="text-pink-500 underline decoration-pink-500 decoration-2">heart</span>.
      </h1>
    </div>
  </section>

  <!-- Input Section -->
  <section class="w-full px-4 sm:px-6 lg:px-8 pb-12 sm:pb-16">
    <div class="max-w-2xl mx-auto space-y-6">

      <mat-form-field class="w-full">
        <mat-label>
          <span class="animation-pulse text-pink-400">What's on your mind?</span>
        </mat-label>
        <textarea id="emotion-input" matInput [(ngModel)]="sentence" [ngModelOptions]="{standalone: true}"
          placeholder="Example: My boss told me that my problem-solving skills have improved lately" rows="4"
          class="resize-none" #prompt>
        </textarea>
        <mat-hint>Describe your feelings in at least 5 words</mat-hint>
      </mat-form-field>

      <div class="flex justify-center sm:justify-start">
        <button (click)="analyzeSentence()" [disabled]="loadingSpinner" class="bg-pink-600 hover:bg-pink-700 text-white font-semibold 
                 py-3 px-8 rounded-lg shadow-md hover:shadow-lg transition-all duration-200
                 disabled:opacity-50 disabled:cursor-not-allowed">
          How do I feel?
        </button>
        <!-- ✅ Loading Spinner -->
        <div *ngIf="loadingSpinner" class="flex items-center gap-3">
          <div class="w-5 h-5 border-3 border-pink-600 border-t-transparent rounded-full"><mat-spinner diameter="30"
              [strokeWidth]="4" [color]="'accent'" [ngStyle]="{ '--mdc-theme-primary': '#ec4899' }"></mat-spinner></div>
          <span class="text-sm text-gray-600">Analyzing...</span>
        </div>
      </div>

    </div>
  </section>

  <!-- Chart Section -->
  <app-emotional-status *ngIf="buttonClicked" [emotionsNormalized]="emotionsNormalized" [statusLoaded]="statusLoaded"
    class="w-full px-4 sm:px-6 lg:px-8 pb-12 sm:pb-16">
  </app-emotional-status>
</form>

<!-- Dropdowns Section (Color Visualization) -->
<app-color-visualization [transformedColorsList]="transformedColorsList" class="w-full px-4 sm:px-6 lg:px-8 pb-16">
</app-color-visualization>
