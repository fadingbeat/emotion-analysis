<div class="flex flex-col-reverse" *ngIf="statusLoaded">
  <canvas baseChart [data]="polarChartData" [options]="polarChartOptions" [type]="'polarArea'" class="chart">
  </canvas>
  <button class="self-center rounded text-sky text-xs underline mt-2" (click)="toggleColorblindMode()">
    {{ isColorBlindMode ? '🎨 Normal Colors' : '👁️ Colorblind Mode' }}
  </button>
</div>
